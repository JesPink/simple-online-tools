name: SEO and tool regression checks

on:
  pull_request:
    branches: [main, product/passive-voice-v2]
  push:
    branches: [main, seo/phase-2-sitemap-and-content-quality, product/passive-voice-benchmark-rebuild]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report npm dependency audit details (non-blocking)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            const vulnerabilities = report.vulnerabilities || {};
            const counts = Object.fromEntries(["low", "moderate", "high", "critical"].map(level => [level, 0]));
            for (const [name, item] of Object.entries(vulnerabilities)) {
              counts[item.severity] = (counts[item.severity] || 0) + 1;
              const via = (item.via || []).map(entry => typeof entry === "string" ? entry : entry.title || entry.name || "advisory");
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                effects: item.effects || [],
                nodes: item.nodes || [],
                via
              }));
            }
            console.log("npm audit summary:", JSON.stringify({ total: Object.keys(vulnerabilities).length, ...counts }));
          '

      - name: Build and validate generated SEO output
        run: npm run build

      - name: Run passive voice engine benchmark
        run: npm run test:engine

      - name: Validate external benchmark parser and Node integration
        run: python3 scripts/evaluate-passive-voice-ud.py --self-test

      - name: Run held-out external UD evaluation (research PR only)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'passivepy-spacy-validation')
        run: python3 scripts/evaluate-passive-voice-ud.py

      - name: Set up Python for research parser (research PR only)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'passivepy-spacy-validation')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spaCy reference parser and model (research PR only)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'passivepy-spacy-validation')
        run: |
          python3 -m pip install --disable-pip-version-check "spacy==3.8.18" \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Run PassivePy-style dependency reference benchmark (research PR only)
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'passivepy-spacy-validation')
        run: python3 scripts/evaluate-passive-voice-passivepy.py

      - name: Install Chromium
        # GitHub-hosted Ubuntu runners include Chromium's system libraries; avoid refreshing third-party apt feeds.
        run: npx playwright install chromium

      - name: Run desktop regression tests
        run: npx playwright test --project="Desktop Chrome"

      - name: Run passive detector mobile regression tests
        run: npx playwright test --project="Mobile Chrome" tests/foundation.spec.js tests/tools.spec.js --grep="passive-voice-detector|Passive Voice Detector"
