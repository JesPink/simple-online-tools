<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found - Simple Online Tools</title>
  <meta name="description" content="The page you requested could not be found. Return to Simple Online Tools to browse available tools.">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); padding: 40px 32px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: #475569; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; color: #fff; background: #2563eb; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page may have moved, or the address may be incorrect.</p>
    <a href="/">Return to Simple Online Tools</a>
  </main>
</body>
</html>
